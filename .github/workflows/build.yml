name: Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'gradle/**'
      - 'gradlew*'
      - '*.gradle.kts'
      - '*.properties'
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release'
        type: boolean
        required: true
        default: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The bootstrap helper is compiled from the payload repository's source
      # rather than committed here as a binary, so the submodule holding it has
      # to be present before CMake runs. Not recursive: the payload repository
      # has submodules of its own that only its own builds need.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # Gradle 9.5.1 / AGP 9.2.1, and the app compiles against Java 21.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The native probe is built through CMake, and AGP will otherwise try to
      # fetch these mid-build. Installing them up front keeps a provisioning
      # failure separate from a compile failure.
      - name: Install SDK components
        run: |
          ndk=$(grep -oP 'ndkVersion\s*=\s*"\K[^"]+' app/build.gradle.kts)
          cmake=$(grep -oP 'version\s*=\s*"\K[0-9.]+' app/build.gradle.kts | head -1)
          echo "ndk=$ndk cmake=$cmake"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;$ndk" "cmake;$cmake" > /dev/null

      - name: Set environment
        run: |
          {
            echo "version=v$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
            echo "commit=$(echo ${{ github.sha }} | cut -c-7)"
            echo "repo=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}"
          } >> "$GITHUB_ENV"

      # Fail before a 3-minute build rather than after it.
      - name: Release preflight
        if: github.event.inputs.release == 'true'
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$STORE_FILE" ]; then
            echo "::error::release requires the signing secrets to be set"
            echo "  STORE_FILE     base64 of the release keystore (JKS)"
            echo "  STORE_PASSWORD keystore password"
            echo "  KEY_ALIAS      signing alias"
            echo "  KEY_PASSWORD   key password"
            echo
            echo "app/android.jks is the public AOSP debug key and is not usable"
            echo "for releases: its private key is published, so anyone could"
            echo "sign an update over the app."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/${{ env.version }}" >/dev/null 2>&1; then
            echo "::error::tag ${{ env.version }} already exists — bump versionName"
            exit 1
          fi

      - name: Build
        env:
          STORE_FILE: ${{ secrets.STORE_FILE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            printf '%s' "$STORE_FILE" | base64 -d > app/release.jks
            ./gradlew assembleRelease --no-daemon
            cp -f app/build/outputs/apk/release/app-release.apk \
              "${{ env.repo }}-${{ env.version }}.apk"
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # The point of the signing config is that the APK actually comes out
      # signed, so assert it rather than assuming. A debug APK must carry the
      # committed AOSP key; a release APK must not.
      - name: Verify signature
        run: |
          set -o pipefail
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            apk="${{ env.repo }}-${{ env.version }}.apk"
          else
            apk=app/build/outputs/apk/debug/app-debug.apk
          fi
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          # How apksigner labels the DN line depends on the build-tools version
          # the runner image happens to ship: older ones print "Signer #1
          # certificate DN", newer ones label it per signature scheme ("V2
          # Signer: certificate DN"). Match only the part that does not move,
          # and check every signer rather than the first.
          debug_key='CN=Android, OU=Android, O=Android'
          dns=$(grep 'certificate DN' certs.txt) || {
            echo "::error::apksigner printed no certificate for $apk"
            exit 1
          }
          if [ "${{ github.event.inputs.release }}" = "true" ]; then
            if printf '%s\n' "$dns" | grep -qF "$debug_key"; then
              echo "::error::release APK is signed with the public debug key"
              exit 1
            fi
          else
            if printf '%s\n' "$dns" | grep -qvF "$debug_key"; then
              echo "::error::debug APK is not signed with app/android.jks"
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: github.event.inputs.release != 'true'
        with:
          name: ${{ env.repo }}(${{ env.version }}@${{ env.commit }})
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.event.inputs.release == 'true'
        with:
          tag_name: ${{ env.version }}
          draft: false
          prerelease: false
          files: ${{ env.repo }}-${{ env.version }}.apk
